# ============================================================
# nginx 配置 (前端容器里的那份)
# ============================================================
#   ① 静态文件
#   ② /api/ 反代后端
#   ③ SSE / WebSocket 长连接
#   ④ 域名 HTTP → HTTPS 跳转
#   ⑤ 证书加载
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 登录/注册限流: 同一 IP 每分钟 10 次, 允许突发 5 次
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ---------- 域名 80: 只做证书验证 + 跳 HTTPS ----------
server {
    listen 80;
    server_name like6657.cn www.like6657.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 默认 80: 直接用 IP 访问时还能用 ----------
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/site-locations.conf;
}

# ---------- 域名 443: 正式站点 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name like6657.cn www.like6657.cn;

    ssl_certificate     /etc/nginx/certs/live/like6657.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/like6657.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/site-locations.conf;
}
