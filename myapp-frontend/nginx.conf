# ============================================================
# nginx 配置 (前端容器里的那份)
# ============================================================
# 它干三件事:
#   ① 把 dist/ 里的静态文件发给浏览器
#   ② 把 /api/xxx 转给后端容器 (同域, 没跨域问题)
#   ③ 给 SSE / WebSocket 放行 (这两样都靠"长连接", 普通代理配置会掐断)
# ============================================================

# WebSocket 需要 "Connection: upgrade", 普通请求需要 "Connection: close"。
# 这个 map 会根据请求头自动选: 浏览器带 Upgrade 头就是升级连接, 否则就是普通请求。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 登录/注册限流: 同一个 IP 每分钟最多 10 次, 允许突发的 5 次。
# 为什么限这两个: 它们是唯一"猜密码"的入口, 也是机器人批量注册的入口。
# 正常用户一分钟不可能登录 10 次, 所以不会误伤。
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传文件最大 10MB (后端自己还会再卡一道 2MB 的限制)
    client_max_body_size 10m;

    # 被限流时返回 429 (默认是 503, 语义不准确)
    limit_req_status 429;

    # ---------- 登录 / 注册: 单独限流 ----------
    # 精确匹配优先于下面的 /api/ 前缀匹配
    location = /api/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000/login;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/register {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000/register;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 压缩: 4M 带宽的救命稻草 ----------
    # 前端打包出来的 JS 有 1.2MB, 压缩后约 300KB。
    # 不开 gzip 的话, 一个用户打开首页就要占好几秒带宽, 别人就卡了。
    gzip on;
    gzip_comp_level 5;          # 1~9, 5 是速度和压缩率比较平衡的档
    gzip_min_length 1024;       # 太小的文件压了反而更慢, 不压
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 后端接口 ----------
    # proxy_pass 结尾带 /: 会把 /api 去掉再转
    #   浏览器请求 /api/articles  →  后端收到 /articles
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / WebSocket 共用的两行
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ★ SSE 必须关掉缓冲: 否则 nginx 会攒一批再发,
        #   通知就不是"实时"的了, 而是过一会儿才一起到。
        proxy_buffering off;

        # 长连接别被 nginx 中途掐掉 (默认 60 秒没数据就断)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 带哈希的静态资源: 可以放心长期缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 单页应用 (Vue Router) ----------
    # 前端是 hash 路由 (#/home), 理论上刷新不会 404;
    # 但保留这行没坏处: 以后换成 history 路由也能直接用。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不能缓存 —— 否则你更新了网站, 用户浏览器还在用旧版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
